# Tools installed to ~/.local/bin (compiled) or ~/bin (scripts/symlinks)
#
# source_builds fields:
#   repo      — git URL to clone
#   version   — git tag/branch/commit to checkout after clone (optional)
#   build     — shell command to build (run from repo root, $INSTALLDIR is ~/.local/bin)
#   needs     — list of commands that must be on PATH (optional)
#
# cloned_repos fields:
#   repo      — git URL to clone
#   dest      — local path to clone into (~ is expanded to $HOME)
#
# local_links fields:
#   source    — path to the file to symlink (~ is expanded to $HOME)
#   dest      — target directory (~ is expanded to $HOME, default: ~/.local/bin)

[source_builds.hell]
repo = "https://github.com/chrisdone/hell.git"
version = "2026-04-21"
build = "cabal install --install-method=copy --installdir=$INSTALLDIR --overwrite-policy=always"
needs = ["cabal"]

# Go-native babashka (Gloat/Glojure). Makefile default PREFIX is $HOME/.local
# for non-root, so this lands at $INSTALLDIR/gobb; stated as needing only
# git/make/curl/bash — no Go toolchain.
[source_builds.gobb]
repo = "https://github.com/gloathub/gobb.git"
# GOROOT must be cleared: mise exports it (go 1.25.6) and it overrides the
# toolchain gloat vendors (go 1.25.7), giving "compile: version does not
# match go tool version" for every package. Verified 2026-08-12.
build = "env -u GOROOT -u GOTOOLCHAIN make install PREFIX=\"$HOME/.local\""
needs = ["make", "curl"]

[cloned_repos.svns]
repo = "https://github.com/JulianBD/svns.git"
dest = "~/Code/svns"

[local_links.svns]
source = "~/Code/svns/svns.hs"
dest = "~/bin"

[local_links.tangle]
source = "~/.config/dotfiles/tangle.janet"
dest = "~/bin"
