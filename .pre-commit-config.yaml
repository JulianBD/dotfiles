# Hooks for the chezmoi source repo, run by prek (https://prek.j178.dev/).
#
# Install once with `prek install`. Files here begin with a dot, so chezmoi
# treats them as private to the repo and never deploys them to $HOME.
repos:
  - repo: local
    hooks:
      - id: chezmoi-readd
        name: chezmoi re-add drifted files
        entry: .hooks/chezmoi-readd.sh
        language: script
        # Drift is repo-wide state, not a property of the staged paths, so the
        # hook has to run even when nothing it cares about was staged.
        always_run: true
        pass_filenames: false
        require_serial: true
