# Defaults for `transcribe save`. Edit freely — this file is read at
# call time, so changes take effect without reloading the module.
#
# Override the location of this file with $env.TRANSCRIBE_CONFIG.

# Directory transcripts are written to. `~` is expanded. This is the vault's
# capture root; the template below adds the per-day folder under it.
directory = "~/Documents/kb/kb-vault/captures"

# Filename template. Available tokens:
#
#   {date}    2026-08-24   — today, ISO order
#   {time}    19-59        — hour-minute, dashed
#   {hhmm}    1959         — hour-minute, the vault capture prefix
#   {slug}    first-high-run — kebab-cased --name, else the audio filename
#   {stem}    3324 Beech Ave 4 — audio filename without extension, verbatim
#   {model}   whisper-1
#   {format}  json | text | srt | vtt
#   {ext}     md for json/text, otherwise the format (srt, vtt)
# A `/` in the template nests: the day folder is created on demand.
#
# This matches the scheme in use across captures/ — captures/YYYY-MM-DD/ with
# HHMM_<kind>_<kebab-slug> inside it, `transcript` being the kind these files
# have carried since captures/2026-08-24/1959_transcript_first-high-run.md.
name_template = "{date}/{hhmm}_transcript_{slug}.{ext}"
